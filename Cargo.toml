[package]
name = "sniper-fourmeme"
edition = "2024"
version = "0.1.0"
authors = ["https://t.me/gold_boris"]
description = "Four.meme sniper & volume bot for BSC in Rust"
keywords = ["bsc","binance","memecoin","sniper","rust","ethers-rs"]
homepage = "https://x.com/goldborisdev"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.7.9"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde", "clock"] }
dotenv = "0.15.0"
ethabi = "18.0.0"
ethers = {version = "2.0.14", features = ["ws", "rustls"] }
futures = "0.3.31"
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = {version = "1.47.1", features = ["full"] }
dashmap = "5.5.3"
reqwest = { version = "0.12.4", features = ["json", "rustls-tls"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10.9"
redis = { version = "0.25.4", features = ["tokio-comp", "aio"] }
mongodb = { version = "2.8.1", features = ["tokio-runtime"] }
once_cell = "1.19"
solana-client = "3.1.5"
solana-account-decoder-client-types = "3.1.5"
solana-commitment-config = "3.0.0"
solana-native-token = "3.0.0"
solana-pubkey = "3.0.0"
grammers-client = "0.7"
grammers-session = "0.7"
grammers-tl-types = "0.7"
tokio-tungstenite = { version = "0.23.1", features = ["rustls-tls-webpki-roots"] }
http = "1.1.0"
unicode-width = "0.1.13"
